<body>
    
       <script>
    
        let price = 100;
        let taxRate = 0.18; 
        let total = price + (price * taxRate); // Addition and Multiplication

        // --- 2. Comparison & Logical Operators ---
        let userAge = 20;
        let hasTicket = true;
        // Logical AND (&&) requires both to be true
        let canEnter = (userAge >= 18) && hasTicket; 

        // --- 3. Ternary Operator (Shorthand If) ---
        let welcomeMessage = canEnter ? "Welcome to the show!" : "Access Denied.";

        // --- 4. Nullish Coalescing (??) ---
        let username = null;
        let displayName = username ?? "Guest User"; // Falls back to "Guest" if null

        // --- Displaying results in the HTML ---
        const outputDiv = document.getElementById('output');
        
        outputDiv.innerHTML = `
            <h2>Calculations</h2>
            <div class="result">Price + 18% Tax: $${total}</div>
            
            <h2>Logic & Comparisons</h2>
            <div class="result">Can Enter? ${canEnter}</div>
            <div class="result">Message: ${welcomeMessage}</div>
            
            <h2>Null Safety</h2>
            <div class="result">User: ${displayName}</div>
        `;

        // Logging to console for debugging
        console.log("Operator logic completed successfully.");
    </script>
   
</body>
